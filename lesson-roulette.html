<style>
/* Layout: app shell — header with tabs; Today = lesson card + "how it was picked" side column; Topics = settings list */
:root {
  --bg: #EEF1F6; --surface: #FFFFFF; --ink: #161D2B; --muted: #596377; --line: #D9DFE8;
  --accent: #2D47C8; --accent-ink: #FFFFFF; --soft: #E3E8F4;
  --good: #23803A; --good-bg: #E3F4E7; --bad: #C2302F; --bad-bg: #FBE6E5;
  --t-spanish: #D4501A; --t-quantum: #6A45D6; --t-rome: #A8264F;
  --t-finance: #23803A; --t-astronomy: #1D6FBF; --t-philosophy: #9A6A00;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-read: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F131B; --surface: #171D28; --ink: #E6EAF2; --muted: #98A2B5; --line: #293142;
  --accent: #8FA3FF; --accent-ink: #0F131B; --soft: #222A3A;
  --good: #6BD487; --good-bg: #17301F; --bad: #FF8A86; --bad-bg: #3A1C1E;
  --t-spanish: #FF8D5C; --t-quantum: #B39BFF; --t-rome: #F48BB0;
  --t-finance: #6BD487; --t-astronomy: #78BFFF; --t-philosophy: #E9BE45;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F131B; --surface: #171D28; --ink: #E6EAF2; --muted: #98A2B5; --line: #293142;
  --accent: #8FA3FF; --accent-ink: #0F131B; --soft: #222A3A;
  --good: #6BD487; --good-bg: #17301F; --bad: #FF8A86; --bad-bg: #3A1C1E;
  --t-spanish: #FF8D5C; --t-quantum: #B39BFF; --t-rome: #F48BB0;
  --t-finance: #6BD487; --t-astronomy: #78BFFF; --t-philosophy: #E9BE45;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-display); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
.tag { font-family: var(--f-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
nav { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 999px; }
nav button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-weight: 500; color: var(--muted); }
nav button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
.sim { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day { font-family: var(--f-mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; font-size: 0.875rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; padding: 10px 18px; font-size: 0.95rem; }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }

/* today layout */
.today { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 820px) { .today { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px clamp(18px, 4vw, 40px); min-width: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--tc); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--tc); }
.lvl { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; display: inline-flex; gap: 8px; align-items: center; }
.lesson h2 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); line-height: 1.15; letter-spacing: -0.02em; margin: 14px 0 18px; text-wrap: balance; font-weight: 700; }
.body { font-family: var(--f-read); font-size: 1.06rem; line-height: 1.7; max-width: 62ch; display: flex; flex-direction: column; gap: 14px; }
.body p { margin: 0; }
.body em { font-style: italic; }
.ex { font-family: var(--f-mono); font-size: 0.9rem; background: var(--soft); padding: 10px 14px; border-radius: 8px; line-height: 1.6; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 26px; }
.hint { color: var(--muted); font-size: 0.85rem; }

/* quiz */
.quiz { margin-top: 30px; padding-top: 26px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 24px; }
.quiz h3 { margin: 0; font-size: 1.1rem; }
.q { display: flex; flex-direction: column; gap: 10px; }
.q .qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q .qnum { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.q .qtext { font-weight: 500; }
.q .rv { font-family: var(--f-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--tc); color: var(--tc); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; line-height: 1.35; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); box-shadow: inset 0 0 0 1px var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad); }
.banner { border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.banner.pass { background: var(--good-bg); }
.banner.fail { background: var(--bad-bg); }
.banner strong { font-size: 1.05rem; }
.banner.pass strong { color: var(--good); }
.banner.fail strong { color: var(--bad); }

/* side */
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font-size: 0.95rem; }
.panel p { margin: 0; color: var(--muted); font-size: 0.85rem; }
.odds { display: flex; flex-direction: column; gap: 9px; }
.odd { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 0.85rem; }
.odd .nm { display: flex; gap: 6px; align-items: center; min-width: 0; }
.odd .nm b { font-weight: 500; }
.odd .pc { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
.odd .bar { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.odd .bar span { display: block; height: 100%; background: var(--tc); opacity: 0.45; border-radius: 3px; }
.odd.picked .bar span { opacity: 1; }
.odd .why { grid-column: 1 / -1; font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); }
.odd.off { opacity: 0.5; }
.pickmark { font-family: var(--f-mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; background: var(--tc); color: var(--surface); padding: 1px 6px; border-radius: 4px; }
.formula { font-family: var(--f-mono); font-size: 0.75rem; background: var(--soft); border-radius: 8px; padding: 8px 10px; color: var(--ink); line-height: 1.5; }

/* topics */
.topics { display: flex; flex-direction: column; gap: 10px; }
.trow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; }
@media (max-width: 640px) { .trow { grid-template-columns: minmax(0, 1fr); } }
.tname { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tname .n { font-weight: 700; font-size: 1.05rem; display: flex; gap: 8px; align-items: center; }
.tname .n::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--tc); }
.tname .sub { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 0.8rem; }
.seg { display: inline-flex; background: var(--soft); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 5px 11px; font-size: 0.82rem; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / 0.1); }
.intro { display: flex; flex-direction: column; gap: 4px; }
.intro h2 { margin: 0; font-size: 1.3rem; }
.intro p { margin: 0; color: var(--muted); max-width: 65ch; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .lesson { animation: rise .35s ease-out; } @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>

    <div class="brand"><h1>Lesson Roulette</h1><span class="tag">Prototype</span></div>

<script>
const TOPICS = [
  { id: "spanish", name: "Spanish", cat: "Languages", lessons: [
    { title: "Two ways to say “to be”", body: [
      "Spanish has two verbs that both mean “to be”: <em>ser</em> and <em>estar</em>. Picking the right one changes the meaning of your sentence.",
      "Use <em>ser</em> for what something <em>is</em>: identity, origin, profession, lasting traits. Use <em>estar</em> for how or where something is right now: moods, conditions, locations.",
      "<div class='ex'>Soy alto. — I am tall.<br>Estoy cansado. — I am tired.<br>El libro está en la mesa. — The book is on the table.</div>",
      "A useful trick: <em>estar</em> is related to “state” and “stay”. If it describes a state that can change, it's usually <em>estar</em>."],
      qs: [
        { q: "How do you say “I am tired”?", opts: ["Soy cansado", "Estoy cansado", "Es cansado"], a: 1 },
        { q: "Which verb do you use for where something is located?", opts: ["Ser", "Estar", "Either one"], a: 1 }] },
    { title: "Nouns have genders", body: [
      "Every Spanish noun is either masculine or feminine, and the word for “the” changes to match: <em>el</em> for masculine, <em>la</em> for feminine.",
      "The usual rule: nouns ending in <em>-o</em> are masculine, nouns ending in <em>-a</em> are feminine. <em>El libro, la casa.</em>",
      "The exceptions are common words you'll meet early, so it's worth learning them as pairs:",
      "<div class='ex'>el día — the day<br>el mapa — the map<br>el problema — the problem<br>la mano — the hand</div>"],
      qs: [
        { q: "How do you say “the day”?", opts: ["La día", "El día", "Lo día"], a: 1 },
        { q: "What gender is <em>mano</em> (hand)?", opts: ["Masculine", "Feminine"], a: 1 }] },
    { title: "Two past tenses", body: [
      "Spanish uses two past tenses where English mostly uses one. The <em>preterite</em> is for completed actions with a clear end. The <em>imperfect</em> is for background, habits, and things that were ongoing.",
      "<div class='ex'>Ayer compré un coche. — Yesterday I bought a car. (done, finished)<br>De niño, jugaba al fútbol. — As a kid, I used to play soccer. (habit)</div>",
      "Think of a movie: the imperfect sets the scene (“it was raining, people were walking”), and the preterite is what happens (“then the door opened”)."],
      qs: [
        { q: "“When I was a kid, I played soccer every day.” Which verb fits?", opts: ["jugué (preterite)", "jugaba (imperfect)"], a: 1 },
        { q: "“Yesterday I bought a car.” Which verb fits?", opts: ["compré (preterite)", "compraba (imperfect)"], a: 0 }] }] },

  { id: "quantum", name: "Quantum mechanics", cat: "Science", lessons: [
    { title: "Waves that arrive as particles", body: [
      "Fire electrons one at a time at a wall with two narrow slits, and record where each one lands on a screen behind it.",
      "Each electron hits the screen at a single point, like a particle. But after thousands of them, the dots form stripes: an <em>interference pattern</em>, the signature of a wave passing through both slits at once.",
      "This is wave-particle duality. It isn't just electrons: light, atoms and even large molecules show the same behavior."],
      qs: [
        { q: "Electrons are sent through two slits one at a time. What pattern builds up?", opts: ["Two bright bands", "An interference pattern of stripes", "A single blurry spot"], a: 1 },
        { q: "Wave-particle duality applies to…", opts: ["Only light", "Only electrons", "Both light and matter"], a: 2 }] },
    { title: "The uncertainty principle", body: [
      "Heisenberg's uncertainty principle says you can't know both a particle's exact position and its exact momentum at the same time.",
      "<div class='ex'>Δx · Δp ≥ ħ / 2</div>",
      "The more tightly position (x) is pinned down, the more spread out momentum (p) must be, and the reverse.",
      "It's often explained as “measuring disturbs the particle,” but the limit is deeper than that. It's built into what a quantum state is, so better instruments won't get around it."],
      qs: [
        { q: "Which pair of quantities does the classic uncertainty principle link?", opts: ["Mass and energy", "Position and momentum", "Speed and color"], a: 1 },
        { q: "Could better instruments eventually beat the limit?", opts: ["Yes, it's a technology problem", "No, it's a basic feature of nature"], a: 1 }] },
    { title: "Superposition and measurement", body: [
      "A quantum system can be in a <em>superposition</em>: a combination of several possible states, each with an <em>amplitude</em>.",
      "When you measure it, you get just one outcome. The chance of each outcome is its amplitude squared (the Born rule).",
      "<div class='ex'>state = 0.6 |A⟩ + 0.8 |B⟩<br>P(A) = 0.6² = 0.36  ·  P(B) = 0.8² = 0.64</div>",
      "After the measurement, the system is in the state you found. Measure again right away and you'll get the same answer."],
      qs: [
        { q: "A state is 0.6|A⟩ + 0.8|B⟩. What's the chance of measuring A?", opts: ["0.6", "0.36", "0.8"], a: 1 },
        { q: "Right after measuring outcome B, the system is…", opts: ["Back in superposition", "In state B", "Destroyed"], a: 1 }] }] },

  { id: "rome", name: "Ancient Rome", cat: "History", lessons: [
    { title: "How the Republic was run", body: [
      "According to Roman tradition, the last king, Tarquin the Proud, was driven out in 509 BC. The Romans swore never to have a king again.",
      "Instead, they elected <em>two consuls</em> each year. Each could veto the other, and both left office after twelve months.",
      "The idea was simple: split power between two people and keep their terms short, so no one could become a king by another name."],
      qs: [
        { q: "How many consuls led the Roman Republic at once?", opts: ["One", "Two", "Five"], a: 1 },
        { q: "How long did a consul serve?", opts: ["One year", "Five years", "For life"], a: 0 }] },
    { title: "Crossing the Rubicon", body: [
      "The Rubicon was a small river marking the edge of Italy proper. Roman law said a general had to leave his army behind before crossing it.",
      "In January 49 BC, Julius Caesar crossed with his legion anyway. That was a declaration of civil war, which is why “crossing the Rubicon” now means a point of no return.",
      "Caesar won the war and was named dictator. He was stabbed to death in the Senate on the Ides of March (March 15), 44 BC."],
      qs: [
        { q: "Why was crossing the Rubicon such a big deal?", opts: ["The river was very dangerous", "Bringing an army into Italy was illegal", "It was sacred to Jupiter"], a: 1 },
        { q: "When was Caesar assassinated?", opts: ["March 15, 44 BC", "January 1, 49 BC", "July 4, 27 BC"], a: 0 }] },
    { title: "Concrete that lasts 2,000 years", body: [
      "Roman concrete mixed lime with <em>volcanic ash</em>, especially ash from around Pozzuoli near Naples.",
      "In harbor walls, seawater seeping through the concrete reacts with the ash and grows new minerals that strengthen it over time. Modern concrete usually weakens in seawater instead.",
      "The Pantheon in Rome, finished around 125 AD, is still the largest unreinforced concrete dome in the world."],
      qs: [
        { q: "What key ingredient made Roman concrete special?", opts: ["Crushed marble", "Volcanic ash", "Iron filings"], a: 1 },
        { q: "What record does the Pantheon still hold?", opts: ["Tallest Roman building", "Largest unreinforced concrete dome", "Oldest church in Europe"], a: 1 }] }] },

  { id: "finance", name: "Personal finance", cat: "Life skills", lessons: [
    { title: "The rule of 72", body: [
      "Compound interest means you earn interest on your interest, not just on what you put in.",
      "A quick way to feel it: divide 72 by the yearly return to get roughly how many years it takes your money to double.",
      "<div class='ex'>At 6% → 72 / 6 = about 12 years to double<br>At 9% → 72 / 9 = about 8 years</div>",
      "This works for costs too. Debt at 24% doubles in about 3 years."],
      qs: [
        { q: "At a 6% return, roughly how long until money doubles?", opts: ["6 years", "12 years", "20 years"], a: 1 },
        { q: "What does “compound” interest mean?", opts: ["Interest on your interest", "Interest paid only once", "Interest that is taxed twice"], a: 0 }] },
    { title: "What an index fund is", body: [
      "An index fund doesn't try to pick winners. It buys every company in an index, like the S&P 500, and simply holds them.",
      "Because nobody is paid to research and trade, fees are very low. Owning hundreds of companies at once also spreads out your risk.",
      "Over long periods, most actively managed funds end up doing worse than the index they're trying to beat, mostly because of their higher fees."],
      qs: [
        { q: "What does an index fund do?", opts: ["Picks the best stocks each year", "Holds every company in an index", "Only buys government bonds"], a: 1 },
        { q: "What's the main reason most active funds trail the index?", opts: ["Bad luck", "Higher fees", "Government rules"], a: 1 }] },
    { title: "How a 1% fee adds up", body: [
      "A 1% yearly fee sounds tiny, but it's charged on your whole balance every year, and it compounds just like returns do.",
      "<div class='ex'>$10,000 for 30 years at a 7% return<br>0.05% fee → about $75,000<br>1.00% fee → about $57,000</div>",
      "That “small” fee costs about $18,000, roughly a quarter of the final amount. Always check a fund's <em>expense ratio</em> before buying."],
      qs: [
        { q: "In the example, roughly how much does the 1% fee cost over 30 years?", opts: ["About $300", "About $3,000", "About $18,000"], a: 2 },
        { q: "Where do you find a fund's yearly fee?", opts: ["Its expense ratio", "Its ticker symbol", "Its dividend yield"], a: 0 }] }] },

  { id: "astronomy", name: "Astronomy", cat: "Science", lessons: [
    { title: "How far is a light-year?", body: [
      "A light-year is a <em>distance</em>, not a time: how far light travels in one year, about 9.46 trillion kilometers.",
      "Sunlight takes about 8 minutes and 20 seconds to reach us, so you always see the Sun as it was 8 minutes ago.",
      "The nearest star after the Sun, Proxima Centauri, is 4.24 light-years away. Its light left before today's kindergarteners were born."],
      qs: [
        { q: "What does a light-year measure?", opts: ["Time", "Distance", "Brightness"], a: 1 },
        { q: "How long does sunlight take to reach Earth?", opts: ["About 8 seconds", "About 8 minutes", "About 8 hours"], a: 1 }] },
    { title: "Why stars twinkle", body: [
      "Stars don't actually flicker. Their light passes through moving pockets of warmer and cooler air, which bend it slightly in different directions from moment to moment.",
      "Stars are so far away they're effectively single points of light, so every bend shows up as a flicker.",
      "Planets are much closer and appear as tiny disks. The flickers from different parts of the disk average out, so planets usually shine steadily. That's a handy way to tell them apart."],
      qs: [
        { q: "What makes stars twinkle?", opts: ["The stars pulsing", "Earth's atmosphere", "Clouds in space"], a: 1 },
        { q: "Why do planets usually twinkle less?", opts: ["They appear as tiny disks, not points", "They are hotter", "They reflect sunlight"], a: 0 }] },
    { title: "Neutron stars", body: [
      "When a massive star explodes as a supernova, its core can collapse into a <em>neutron star</em>: about 20 km across but holding more mass than the Sun.",
      "The matter is so dense that a teaspoon of it would weigh billions of tons on Earth.",
      "Some neutron stars spin hundreds of times per second and sweep beams of radiation across space like a lighthouse. We call those <em>pulsars</em>."],
      qs: [
        { q: "About how wide is a neutron star?", opts: ["20 km", "2,000 km", "The size of the Sun"], a: 0 },
        { q: "What is a pulsar?", opts: ["A pulsing comet", "A spinning neutron star with beams", "A dying planet"], a: 1 }] }] },

  { id: "philosophy", name: "Philosophy", cat: "Humanities", lessons: [
    { title: "The Socratic method", body: [
      "Socrates rarely told people what to think. He asked questions.",
      "He'd take a confident claim (“courage is never running away”) and keep asking until the person found a contradiction in their own view (“what about a smart retreat?”).",
      "The goal wasn't to win. It was to show that a belief needed more thought. Good teachers and lawyers still use the method today."],
      qs: [
        { q: "What was Socrates' main tool?", opts: ["Long lectures", "Questions", "Written books"], a: 1 },
        { q: "The method usually aims to…", opts: ["Expose contradictions in a belief", "Memorize facts", "Settle debates by vote"], a: 0 }] },
    { title: "The trolley problem", body: [
      "Philosopher Philippa Foot posed it in 1967: a runaway trolley will kill five people unless you pull a lever to send it onto a track where it will kill one.",
      "Most people say pull the lever, since five lives outweigh one. That's <em>utilitarian</em> reasoning: judge actions by their outcomes.",
      "But change the story so you must push someone off a bridge to stop the trolley, and most people refuse, even though the numbers are the same. That gap is the puzzle."],
      qs: [
        { q: "Who first posed the trolley problem?", opts: ["Immanuel Kant", "Philippa Foot", "Plato"], a: 1 },
        { q: "“Pull the lever because five outweigh one” is an example of…", opts: ["Utilitarian reasoning", "Stoicism", "Nihilism"], a: 0 }] },
    { title: "The Ship of Theseus", body: [
      "Plutarch describes the ship of the hero Theseus, kept in Athens for centuries. As planks rotted, they were replaced, until no original wood was left. Is it still the same ship?",
      "Thomas Hobbes added a twist: suppose someone saved every old plank and rebuilt the ship from them. Now there are two ships. Which one is the real one?",
      "The puzzle is about identity over time, and it applies to you too: most of the cells in your body have been replaced over the years."],
      qs: [
        { q: "Who added the “rebuild it from the old planks” twist?", opts: ["Thomas Hobbes", "Aristotle", "Descartes"], a: 0 },
        { q: "What is the puzzle really about?", opts: ["Shipbuilding", "Identity over time", "Greek mythology"], a: 1 }] }] }
];
const LEVELS = [{ v: 0, label: "Off" }, { v: 1, label: "Sometimes" }, { v: 2, label: "Often" }, { v: 3, label: "Lots" }];
const WEIGHT = { 0: 0, 1: 1, 2: 2, 3: 4 };
const KEY = "lesson-roulette-v1";
const byId = Object.fromEntries(TOPICS.map(t => [t.id, t]));

function seed() {
  return {
    v: 1, day: 12, tab: "today",
    topics: {
      spanish: { interest: 3, idx: 1, lastSeen: 11 },
      quantum: { interest: 2, idx: 1, lastSeen: 7 },
      rome: { interest: 2, idx: 0, lastSeen: null },
      finance: { interest: 1, idx: 2, lastSeen: 4 },
      astronomy: { interest: 3, idx: 0, lastSeen: null },
      philosophy: { interest: 0, idx: 0, lastSeen: null }
    },
    done: [
      { topic: "finance", idx: 0, day: 2 }, { topic: "finance", idx: 1, day: 4 },
      { topic: "quantum", idx: 0, day: 7 }, { topic: "spanish", idx: 0, day: 11 }
    ],
    today: null
  };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {} return seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const rand = n => Math.floor(Math.random() * n);

let S = load();

function odds() {
  return TOPICS.map(t => {
    const st = S.topics[t.id];
    const unseen = st.lastSeen == null ? null : S.day - st.lastSeen;
    const boost = 1 + Math.min(unseen == null ? 10 : unseen, 10) * 0.1;
    const finished = st.idx >= t.lessons.length;
    const w = finished ? 0 : WEIGHT[st.interest] * boost;
    return { id: t.id, interest: st.interest, unseen, boost, finished, w };
  });
}

function startDay() {
  const o = odds(), total = o.reduce((s, x) => s + x.w, 0);
  let pick = null;
  if (total > 0) { let r = Math.random() * total; for (const x of o) { r -= x.w; if (r <= 0 && x.w > 0) { pick = x.id; break; } } if (!pick) pick = o.filter(x => x.w > 0).pop().id; }
  const pool = S.done.filter(d => d.topic !== pick);
  let review = null;
  if (pool.length) { const d = pool[rand(pool.length)]; review = { topic: d.topic, idx: d.idx, qi: rand(byId[d.topic].lessons[d.idx].qs.length) }; }
  S.today = { day: S.day, topic: pick, idx: pick ? S.topics[pick].idx : null, odds: o, total, review, phase: "lesson", answers: {}, result: null };
  save();
}

function questions() {
  const T = S.today, L = byId[T.topic].lessons[T.idx];
  const list = L.qs.map((q, i) => ({ ...q, key: "q" + i, topic: T.topic }));
  if (T.review) { const R = T.review; list.push({ ...byId[R.topic].lessons[R.idx].qs[R.qi], key: "r", topic: R.topic, review: true }); }
  return list;
}

function submit() {
  const T = S.today, qs = questions();
  const lessonQs = qs.filter(q => !q.review);
  const right = lessonQs.filter(q => T.answers[q.key] === q.a).length;
  const pass = right === lessonQs.length;
  const reviewQ = qs.find(q => q.review);
  const st = S.topics[T.topic];
  st.lastSeen = S.day;
  if (pass) { st.idx = T.idx + 1; S.done.push({ topic: T.topic, idx: T.idx, day: S.day }); }
  T.result = { pass, right, of: lessonQs.length, review: reviewQ ? T.answers.r === reviewQ.a : null };
  T.phase = "result";
  save();
}

const tc = id => `style="--tc: var(--t-${id})"`;
const pips = (id, n, total) => `<span class="pips" ${tc(id)}>${Array.from({ length: total }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;
const ago = n => n == null ? "never" : n === 0 ? "today" : n === 1 ? "yesterday" : n + " days ago";

function renderToday() {
  const T = S.today;
  if (!T.topic) return `<div class="card empty"><h2>Nothing to learn today</h2><p>Every topic is turned off or finished. Turn some on in My topics, then skip to the next day.</p><div class="actions" style="justify-content:center"><button class="btn primary" data-action="tab" data-tab="topics">Choose topics</button></div></div>`;
  const t = byId[T.topic], L = t.lessons[T.idx];
  let html = `<article class="card lesson" ${tc(t.id)}>
    <div class="meta"><span class="chip">${t.name}</span><span class="lvl">Level ${T.idx + 1} of ${t.lessons.length} ${pips(t.id, T.idx + 1, t.lessons.length)}</span></div>
    <h2>${L.title}</h2>
    <div class="body">${L.body.map(p => p.startsWith("<div") ? p : `<p>${p}</p>`).join("")}</div>`;
  if (T.phase === "lesson") {
    html += `<div class="actions"><button class="btn primary" data-action="quiz">Quiz me</button><span class="hint">${T.review ? "2 questions on this lesson, plus 1 review" : "2 quick questions"}</span></div>`;
  } else {
    const qs = questions(), done = T.phase === "result";
    html += `<section class="quiz" aria-label="Quiz"><h3>${done ? "Results" : "Quick check"}</h3>`;
    if (done) {
      const R = T.result, next = t.lessons[T.idx + 1];
      html += R.pass
        ? `<div class="banner pass"><strong>Level up: ${R.right}/${R.of}</strong><span>${next ? `Next time ${t.name} comes up, you'll get Level ${T.idx + 2}: “${next.title}”.` : `That was the last ${t.name} lesson in this prototype. It's now out of the rotation.`}</span></div>`
        : `<div class="banner fail"><strong>Not quite: ${R.right}/${R.of}</strong><span>You'll get this lesson again the next time ${t.name} comes up.</span></div>`;
    }
    qs.forEach((q, n) => {
      const ans = T.answers[q.key];
      html += `<div class="q" ${tc(q.topic)}><div class="qhead"><span class="qnum">${n + 1}/${qs.length}</span>${q.review ? `<span class="rv">Review · ${byId[q.topic].name}</span>` : ""}<span class="qtext">${q.q}</span></div>
        <div class="opts" role="radiogroup">${q.opts.map((o, i) => {
          let cls = "opt";
          if (done && i === q.a) cls += " right"; else if (done && i === ans) cls += " wrong";
          return `<button class="${cls}" role="radio" aria-checked="${ans === i}" ${done ? "disabled" : ""} data-action="answer" data-key="${q.key}" data-i="${i}">${o}</button>`;
        }).join("")}</div></div>`;
    });
    const all = qs.every(q => T.answers[q.key] != null);
    html += done
      ? `<div class="actions"><button class="btn primary" data-action="next">Go to tomorrow's lesson</button><span class="hint">In the real app, this would arrive by email tomorrow morning.</span></div>`
      : `<div class="actions"><button class="btn primary" data-action="submit" ${all ? "" : "disabled"}>Check answers</button><span class="hint">${all ? "" : "Answer all " + qs.length + " to continue"}</span></div>`;
    html += `</section>`;
  }
  html += `</article>`;

  const rows = T.odds.slice().sort((a, b) => b.w - a.w).map(x => {
    const pct = T.total ? (x.w / T.total) * 100 : 0;
    const why = x.finished ? "all lessons done" : x.interest === 0 ? "turned off" : `${LEVELS[x.interest].label.toLowerCase()} ×${WEIGHT[x.interest]} · last seen ${ago(x.unseen)} ×${x.boost.toFixed(1)}`;
    return `<div class="odd ${x.id === T.topic ? "picked" : ""} ${x.w === 0 ? "off" : ""}" ${tc(x.id)}>
      <span class="nm"><b>${byId[x.id].name}</b>${x.id === T.topic ? `<span class="pickmark">Picked</span>` : ""}</span><span class="pc">${pct.toFixed(0)}%</span>
      <span class="bar"><span style="width:${pct}%"></span></span><span class="why">${why}</span></div>`;
  }).join("");
  const side = `<aside class="side"><div class="panel"><h3>How today's topic was picked</h3>
    <div class="odds">${rows}</div>
    <div class="formula">chance ∝ interest × freshness<br>interest: 1 · 2 · 4<br>freshness: +10% per day unseen, up to ×2</div>
    <p>Topics you haven't seen in a while get a gentle nudge so nothing gets forgotten.</p></div>
    <div class="panel"><h3>Your progress</h3>${TOPICS.filter(t => S.topics[t.id].interest > 0).map(t => {
      const n = Math.min(S.topics[t.id].idx, t.lessons.length);
      return `<div class="odd" ${tc(t.id)}><span class="nm"><b>${t.name}</b></span><span class="pc">${n}/${t.lessons.length}</span></div>`;
    }).join("")}<p>${S.done.length} lessons completed so far.</p></div></aside>`;
  return `<div class="today">${html}${side}</div>`;
}

function renderTopics() {
  return `<div class="intro"><h2>My topics</h2><p>Set how often each topic should come up. Changes apply from the next day's pick. A real version would have many more categories to browse.</p></div>
  <div class="topics" style="margin-top:16px">${TOPICS.map(t => {
    const st = S.topics[t.id], n = Math.min(st.idx, t.lessons.length);
    const unseen = st.lastSeen == null ? null : S.day - st.lastSeen;
    return `<div class="trow" ${tc(t.id)}><div class="tname"><span class="n">${t.name}</span>
      <span class="sub"><span>${t.cat}</span><span class="lvl">${n}/${t.lessons.length} done ${pips(t.id, n, t.lessons.length)}</span><span>Last lesson: ${ago(unseen)}</span></div>
      <div class="seg" role="radiogroup" aria-label="How often for ${t.name}">${LEVELS.map(l => `<button role="radio" aria-checked="${st.interest === l.v}" data-action="interest" data-topic="${t.id}" data-v="${l.v}">${l.label}</button>`).join("")}</div></div>`;
  }).join("")}</div>`;
}

function render() {
  if (!S.today || S.today.day !== S.day) startDay();
  document.getElementById("day").textContent = "Day " + S.day;
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", b.dataset.tab === S.tab);
  document.getElementById("app").innerHTML = S.tab === "today" ? renderToday() : renderTopics();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  const a = b.dataset.action;
  if (a === "tab") S.tab = b.dataset.tab;
  else if (a === "next") { S.day += 1; S.tab = "today"; startDay(); window.scrollTo({ top: 0 }); }
  else if (a === "reset") { S = seed(); }
  else if (a === "quiz") S.today.phase = "quiz";
  else if (a === "answer") S.today.answers[b.dataset.key] = +b.dataset.i;
  else if (a === "submit") submit();
  else if (a === "interest") S.topics[b.dataset.topic].interest = +b.dataset.v;
  save(); render();
});

render();
</script>
