name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules:
    name: Unit tests (rules, color contrast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Database schema and access rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pisara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pisara_test
    steps:
      - uses: actions/checkout@v4
      - name: Schema and access rules
        run: |
          supabase/tests/load_schema.sh pisara_test
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
      - name: Fresh database for the delivery job tests
        run: |
          createdb pisara_jobs
          supabase/tests/load_schema.sh pisara_jobs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Delivery job against Postgres
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pisara_jobs

  pages:
    name: Pages (axe and keyboard)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pisara_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pisara_e2e
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/load_schema.sh pisara_e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
